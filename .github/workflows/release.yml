name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

# Deny by default; each job grants itself only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_name: ${{ steps.meta.outputs.build_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point at a commit on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Derive version
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            version="${tag#v}"
          else
            tag="dry-run"
            version="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)-dry-run"
          fi
          build_name="${version%%-*}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build_name=$build_name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          umask 077
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$keystore"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APK
        env:
          BUILD_NAME: ${{ needs.verify.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Verify APK is signed with the release key
        env:
          # Public SHA-256 digest of the release certificate (not a secret).
          # Update it if the keystore is ever rotated.
          EXPECTED_CERT_SHA256: 7d46e9317bd0291d3a9b955b45ffebd86e340b1f9fc334d4bac5e6057dae5e56
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          echo "apksigner: ${apksigner:-<not found>}"
          [ -n "$apksigner" ] || { echo "::error::apksigner not found under \$ANDROID_HOME"; exit 1; }

          status=0
          certs="$("$apksigner" verify --print-certs "$apk" 2>&1)" || status=$?
          echo "$certs"
          [ "$status" -eq 0 ] || { echo "::error::apksigner verify failed (exit $status)"; exit 1; }

          if echo "$certs" | grep -qi 'Android Debug'; then
            echo "::error::APK is debug-signed"; exit 1
          fi
          # Format-agnostic: apksigner output layout differs between build-tools versions.
          echo "$certs" | grep -qi "$EXPECTED_CERT_SHA256" \
            || { echo "::error::APK not signed with the expected release certificate"; exit 1; }

      - name: Name artifact
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TumbasServis-${TAG}.apk"

      - name: Remove signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS DMG
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build macOS app (ad-hoc signed, no Apple credentials)
        env:
          BUILD_NAME: ${{ needs.verify.outputs.build_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build macos --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Package DMG
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          app="build/macos/Build/Products/Release/Tumbas Service.app"
          codesign --verify --deep --strict "$app"
          mkdir dist
          hdiutil create -volname "Tumbas Service" -srcfolder "$app" -ov -format UDZO \
            "dist/TumbasServis-${TAG}-macos.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [verify, android, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          
          for attempt in 1 2 3; do
            if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" ./*; then
              exit 0
            fi
            echo "::warning::gh release create failed (attempt $attempt of 3)"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            sleep $((attempt * 20))
          done
          echo "::error::Could not create the release after 3 attempts"
          exit 1
